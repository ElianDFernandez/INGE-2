{% extends 'app/base.html' %}

{% block title %}Recuperar contraseña - Centro de Gestión{% endblock %}

{% block content %}
<style>
    .reset-shell {
        min-height: 80vh;
    }

    .reset-card {
        border: 0;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.12);
    }

    .reset-card-header {
        background: var(--cad-primary);
        color: var(--cad-white);
        padding: 1.25rem 1.5rem;
    }

    .reset-card-body {
        background: #ffffff;
        padding: 1.5rem;
    }

    .reset-title {
        margin: 0;
        font-size: 1.4rem;
        font-weight: 700;
    }

    .reset-text {
        color: #6c757d;
        font-size: 0.95rem;
    }
</style>

<div class="row justify-content-center align-items-center reset-shell">
    <div class="col-md-7 col-lg-5 col-xl-4">
        <div class="reset-card">
            <div class="reset-card-header text-center">
                <h3 class="reset-title">Recuperar contraseña</h3>
            </div>
            <div class="reset-card-body">
                <p class="reset-text text-center mb-4">
                    Ingresá el email asociado a tu cuenta y te enviaremos un enlace para restablecerla.
                </p>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_email" class="form-label">Email</label>
                        <input type="email" name="email" autocomplete="email" maxlength="254" class="form-control" required id="id_email" placeholder="tu@email.com">
                    </div>
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg fs-6">
                            Enviar enlace <i class="fa-solid fa-paper-plane ms-1"></i>
                        </button>
                        <a href="{% url 'login' %}" class="btn btn-outline-secondary btn-lg fs-6">
                            <i class="fa-solid fa-arrow-left me-1"></i> Volver
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'app/base.html' %}
{% load static %}

{% block title %}Mi Perfil{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 mx-auto">
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="mb-2">
                    <h4 class="card-title mt-2">Mi Perfil</h4>
                </div>
                <!-- Formulario perfil -->
                <form method="post" action="">
                    {% csrf_token %}
                    <input type="hidden" name="action" value="save">
                    <div class="row g-2">
                        <div class="col-12 col-md-6">
                            <label class="form-label">Usuario</label>
                            <input name="username" type="text" class="form-control" value="{{ user.username }}" placeholder="Usuario">
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label">Email</label>
                            <input name="email" type="email" class="form-control" value="{{ user.email }}" placeholder="correo@ejemplo.com">
                        </div>
                    </div>
                    <hr class="my-3">
                    <h6 class="mb-2">Cambiar contraseña (opcional)</h6>
                    <div class="row g-2">
                        <div class="col-12 col-md-6">
                            <label class="form-label">Contraseña actual</label>
                            <div class="input-group">
                                <input name="current_password" type="password" class="form-control password-toggle" id="current_pwd" placeholder="Dejar vacío para no cambiar">
                                <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('current_pwd')">
                                    <i class="fa-solid fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label">Nueva contraseña</label>
                            <div class="input-group">
                                <input name="new_password" type="password" class="form-control password-toggle" id="new_pwd" placeholder="Nueva contraseña">
                                <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('new_pwd')">
                                    <i class="fa-solid fa-eye"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between mt-4">
                        <a href="{% url 'landing' %}" class="btn btn-outline-secondary">
                            <i class="fa-solid fa-arrow-left me-2"></i>Atrás
                        </a>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
function togglePassword(elementId) {
    const input = document.getElementById(elementId);
    const button = event.target.closest('button');
    const icon = button.querySelector('i');
    
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
    }
}
</script>
{% endblock %}

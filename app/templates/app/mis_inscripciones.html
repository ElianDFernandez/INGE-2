{% extends 'app/base.html' %}

{% block title %}Mis Inscripciones{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold" style="color: var(--cad-primary);">Mis Inscripciones</h2>
        <a href="{% url 'home' %}" class="btn btn-outline-secondary">
            <i class="fa-solid fa-arrow-left me-1"></i> Volver
        </a>
    </div>
    <div class="card shadow-sm border-0 p-4">
        <h4 class="mb-3">Mis Turnos</h4>
        {% if not turnos %}
            <div class="alert alert-info text-center py-4 mb-0">
                <i class="fa-solid fa-circle-info fa-2x mb-3"></i>
                <h5>No posee inscripciones a turnos</h5>
            </div>
        {% endif %}
        {% if not reservas %}
        <h4 class="mb-3">Mis reservas</h4>
            <div class="alert alert-info text-center py-4 mb-0">
                <i class="fa-solid fa-circle-info fa-2x mb-3"></i>
                <h5>No posees reservas de clases</h5>
            </div>
        {% endif %}
    </div>
</div>
{% endblock %}

{% extends 'app/base.html' %}

{% block title %}Email enviado - Centro de Gestión{% endblock %}

{% block content %}
<style>
    .reset-shell {
        min-height: 80vh;
    }

    .reset-card {
        border: 0;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.12);
    }

    .reset-card-header {
        background: linear-gradient(135deg, #004383 70%, #5DA515 70%);
        color: #FDFDFD;
        padding: 1.25rem 1.5rem;
    }

    .reset-card-body {
        background: #ffffff;
        padding: 1.5rem;
    }

    .reset-title {
        margin: 0;
        font-size: 1.4rem;
        font-weight: 700;
    }

    .reset-text {
        color: #6c757d;
        font-size: 0.95rem;
    }
</style>

<div class="row justify-content-center align-items-center reset-shell">
    <div class="col-md-7 col-lg-5 col-xl-4">
        <div class="reset-card text-center">
            <div class="reset-card-header">
                <h3 class="reset-title">Revisá tu correo</h3>
            </div>
            <div class="reset-card-body">
                <p class="reset-text mb-4">
                    Si el email está registrado, vas a recibir un enlace para crear una nueva contraseña.
                </p>
                <a href="{% url 'login' %}" class="btn btn-primary btn-lg fs-6">
                    <i class="fa-solid fa-arrow-left me-1"></i> Volver al login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

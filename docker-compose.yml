services:
  web:
    build: .
    # Comando para levantar el servidor de desarrollo de Django
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:                              
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:                              
      - redis
    networks:       
      - app_network

  #Servicio redis y celery
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:        
      - app_network  

  celery:
    build: .
    command: sh -c "cd /app && celery -A core.celery worker -l info"
    volumes:
      - .:/app 
    depends_on:
      - redis
      - web
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    networks:        
      - app_network  
networks:           
  app_network:
    driver: bridge    
volumes : 
  redis_data:        
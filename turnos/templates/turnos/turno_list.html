{% extends 'app/base.html' %}

{% block title %}Gestión de Turnos - CAD{% endblock %}

{% block content %}
<div class="mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 style="color: var(--cad-primary);">
            <i class="fa-solid fa-calendar-days me-2"></i>Gestión de Turnos
        </h2>

        <a href="{% url 'turno_create' %}" class="btn btn-main-cad">
            <i class="fa-solid fa-plus me-2"></i>Nuevo Turno
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead style="background-color: var(--cad-primary); color: white;">
                    <tr>
                        <th class="ps-4">Nombre</th>
                        <th class="pe-4 text-end">Acciones</th>
                    </tr>
                </thead>

                <tbody>
                    {% for turno in turnos %}
                    <tr>
                        <!-- Aca va la logica para filtrar turnos que no son de actividades mias? -->
                        <td class="ps-4 fw-bold">{{ turno.nombre }}</td>

                        <td class="pe-4 text-end">

                            <a href="{% url 'turno_edit' turno.pk %}"
                               class="btn btn-sm btn-outline-secondary"
                               title="Editar">
                                <i class="fa-solid fa-pen"></i>
                            </a>

                            <a href="{% url 'turno_delete' turno.pk %}"
                               class="btn btn-sm btn-outline-danger ms-1"
                               title="Eliminar">
                                <i class="fa-solid fa-trash"></i>
                            </a>

                        </td>
                    </tr>

                    {% empty %}
                    <tr>
                        <td colspan="2" class="text-center py-4 text-muted">
                            No hay turnos registrados todavía.
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>

            </table>
        </div>
    </div>
</div>
{% endblock %}
